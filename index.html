<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scattered Floating Video Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-glow"></div>

  <div class="scatter-scene" id="scene">
    <!-- Center Hero Focus -->
    <div class="center-content">
      <p class="tagline">KBFC UNFILTERED</p>
      <h1>Watch exclusive player interviews, training sessions, match highlights, and other events.</h1>
    </div>

    <!-- Scattered Video 1 -->
    <div class="scatter-card card-pos-1">
      <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=600&q=80" alt="Player Interview" />
      <div class="play-pill">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="card-info">
        <span class="card-tag">Player Talk</span>
        <div class="card-title">Momo Yansan&eacute;</div>
      </div>
    </div>

    <!-- Scattered Video 2 -->
    <div class="scatter-card card-pos-2">
      <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80" alt="Training" />
      <div class="play-pill">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="card-info">
        <span class="card-tag">Episode 04</span>
        <div class="card-title">Training Unfiltered</div>
      </div>
    </div>

    <!-- Scattered Video 3 -->
    <div class="scatter-card card-pos-3">
      <img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=600&q=80" alt="Press Conference" />
      <div class="play-pill">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="card-info">
        <span class="card-tag">Exclusive</span>
        <div class="card-title">Amit Rana Session</div>
      </div>
    </div>

    <!-- Scattered Video 4 -->
    <div class="scatter-card card-pos-4">
      <img src="https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=600&q=80" alt="Pool Session" />
      <div class="play-pill">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="card-info">
        <span class="card-tag">Recovery</span>
        <div class="card-title">Pool Session</div>
      </div>
    </div>

    <!-- Scattered Video 5 -->
    <div class="scatter-card card-pos-5">
      <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=80" alt="Pitch Drill" />
      <div class="play-pill">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="card-info">
        <span class="card-tag">Behind the Scenes</span>
        <div class="card-title">Hasney Aljofree</div>
      </div>
    </div>

    <!-- Scattered Video 6 -->
    <div class="scatter-card card-pos-6">
      <img src="https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=600&q=80" alt="Matchday" />
      <div class="play-pill">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="card-info">
        <span class="card-tag">Media Room</span>
        <div class="card-title">Press Conference</div>
      </div>
    </div>
  </div>

</body>
</html>
